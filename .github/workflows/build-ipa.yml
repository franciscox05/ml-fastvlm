name: Build FastVLM IPA (unsigned)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Listar schemes
        run: xcodebuild -list -project app/FastVLM.xcodeproj

      - name: Descarregar modelo pre-treinado (FastVLM 0.5B)
        run: |
          chmod +x app/get_pretrained_mlx_model.sh
          app/get_pretrained_mlx_model.sh --model 0.5b --dest app/FastVLM/model
          ls -la app/FastVLM/model

      - name: Build archive (sem assinatura)
        run: |
          xcodebuild archive \
            -project app/FastVLM.xcodeproj \
            -scheme "FastVLM App" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FastVLM.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Empacotar .ipa cru
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/FastVLM.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          echo "App encontrada em: $APP_PATH"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP_PATH" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -r FastVLM.ipa Payload
          ls -la FastVLM.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastVLM-unsigned-ipa
          path: build/FastVLM.ipa
          retention-days: 7
